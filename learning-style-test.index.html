<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>学习风格测试 - 找到最适合你的学习方式</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #333;
    padding: 20px 16px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 24px 20px;
    max-width: 420px;
    margin: 0 auto;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  }
  .logo { text-align: center; margin-bottom: 8px; }
  .logo span { font-size: 40px; }
  h1 { font-size: 22px; text-align: center; color: #2d3748; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #718096; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .tag { background: #edf2f7; color: #4a5568; padding: 4px 12px; border-radius: 12px; font-size: 12px; }
  .btn {
    display: block; width: 100%; padding: 14px; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .btn-primary:active { transform: scale(0.97); }
  .btn-ghost { background: #f7fafc; color: #4a5568; margin-top: 10px; }
  .progress-bar { height: 6px; background: #e2e8f0; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 3px; transition: width 0.3s; }
  .question-num { font-size: 14px; color: #718096; margin-bottom: 12px; }
  .question-text { font-size: 16px; font-weight: 600; color: #2d3748; margin-bottom: 16px; line-height: 1.5; }
  .option {
    display: block; width: 100%; padding: 14px 16px; margin-bottom: 10px;
    background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 12px;
    font-size: 15px; text-align: left; cursor: pointer; transition: all 0.2s;
    color: #2d3748;
  }
  .option:active, .option.selected { background: #ebf4ff; border-color: #667eea; }
  .result-icon { font-size: 56px; text-align: center; margin: 10px 0; }
  .result-type { text-align: center; font-size: 24px; font-weight: 700; color: #667eea; margin-bottom: 4px; }
  .result-label { text-align: center; font-size: 14px; color: #718096; margin-bottom: 16px; }
  .result-brief { background: #f7fafc; border-radius: 12px; padding: 16px; margin-bottom: 16px; line-height: 1.7; font-size: 14px; color: #4a5568; }
  .locked { filter: blur(4px); user-select: none; pointer-events: none; }
  .unlock-tip {
    background: #fffaf0; border: 1px solid #fbd38d; border-radius: 12px;
    padding: 16px; text-align: center; margin-bottom: 16px;
  }
  .unlock-tip .price { font-size: 28px; font-weight: 700; color: #dd6b20; margin: 8px 0; }
  .unlock-tip .price small { font-size: 14px; color: #a0aec0; text-decoration: line-through; margin-left: 6px; }
  .features { text-align: left; font-size: 13px; color: #718096; margin: 12px 0; }
  .features li { margin-bottom: 4px; list-style: none; padding-left: 20px; position: relative; }
  .features li::before { content: "✓"; position: absolute; left: 0; color: #48bb78; font-weight: bold; }
  .full-report { line-height: 1.8; font-size: 14px; color: #2d3748; }
  .full-report h3 { color: #667eea; margin: 16px 0 8px; font-size: 16px; }
  .full-report p { margin-bottom: 10px; }
  .footer-tip { text-align: center; font-size: 12px; color: #a0aec0; margin-top: 16px; }
  .hidden { display: none !important; }
  .loading { text-align: center; padding: 40px; color: #718096; }
  .loading .spinner { font-size: 32px; animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- 首页 -->
<div id="page-home" class="card">
  <div class="logo"><span>🎓</span></div>
  <h1>你的学习风格是什么？</h1>
  <p class="subtitle">16 道题，3 分钟测出最适合你的学习方式<br>告别低效努力，找到提分捷径</p>
  <div class="tag-list">
    <span class="tag">👁️ 视觉型</span>
    <span class="tag">👂 听觉型</span>
    <span class="tag">📖 读写型</span>
    <span class="tag">✋ 动觉型</span>
  </div>
  <button class="btn btn-primary" onclick="startTest()">开始测试（免费）</button>
  <p class="footer-tip">已有 12,800+ 大学生完成测试</p>
</div>

<!-- 答题页 -->
<div id="page-test" class="card hidden">
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <div class="question-num" id="q-num">第 1 / 16 题</div>
  <div class="question-text" id="q-text"></div>
  <div id="options"></div>
</div>

<!-- 结果页 -->
<div id="page-result" class="card hidden">
  <div class="result-icon" id="r-icon"></div>
  <div class="result-type" id="r-type"></div>
  <div class="result-label" id="r-label"></div>
  <div class="result-brief" id="r-brief"></div>

  <!-- 付费区 -->
  <div id="pay-section">
    <div class="full-report locked" id="full-report"></div>
    <div class="unlock-tip">
      <div style="font-size:15px;font-weight:600;">🔒 解锁完整学习报告</div>
      <div class="price">¥4.99 <small>¥19.9</small></div>
      <ul class="features">
        <li>你的学习风格深度解析</li>
        <li>专属学习方法与提分策略</li>
        <li>短板突破建议</li>
        <li>期末/考研备考规划</li>
      </ul>
      <button class="btn btn-primary" onclick="pay()">立即解锁完整报告</button>
      <button class="btn btn-ghost" onclick="shareResult()">分享给同学</button>
    </div>
  </div>

  <!-- 已解锁 -->
  <div id="unlocked-section" class="hidden">
    <div class="full-report" id="full-report-show"></div>
    <button class="btn btn-primary" onclick="restart()">再测一次</button>
  </div>
</div>

<!-- 支付中 -->
<div id="page-loading" class="card hidden">
  <div class="loading">
    <div class="spinner">⏳</div>
    <p style="margin-top:12px;">正在跳转支付...</p>
  </div>
</div>

<script>
// ============ 题库（VARK 学习风格，16题，每题4选项对应 V/A/R/K） ============
const questions = [
  { q: "老师讲新知识点时，你更容易记住哪种方式？", opts: [
    { t: "看黑板/PPT上的图表和文字", d: "V" },
    { t: "听老师讲解和举例", d: "A" },
    { t: "自己看书和笔记", d: "R" },
    { t: "动手做练习题或实验", d: "K" }
  ]},
  { q: "复习考试时，你最常用的方法是？", opts: [
    { t: "画思维导图、用彩色笔标注重点", d: "V" },
    { t: "朗读知识点、跟同学讨论", d: "A" },
    { t: "反复看书、抄笔记", d: "R" },
    { t: "做题、做实验、实际操作", d: "K" }
  ]},
  { q: "当你要学一个新软件时，你倾向于？", opts: [
    { t: "看图解教程或视频演示", d: "V" },
    { t: "听别人讲解怎么用", d: "A" },
    { t: "读帮助文档或说明书", d: "R" },
    { t: "直接打开软件摸索", d: "K" }
  ]},
  { q: "在小组作业中，你最喜欢的角色是？", opts: [
    { t: "做PPT、画图、整理视觉材料", d: "V" },
    { t: "参与讨论、口头汇报", d: "A" },
    { t: "写报告、整理文字资料", d: "R" },
    { t: "动手做模型、做演示", d: "K" }
  ]},
  { q: "记英语单词，你觉得哪种方式最有效？", opts: [
    { t: "看单词的拼写和形状", d: "V" },
    { t: "听发音、大声朗读", d: "A" },
    { t: "抄单词、写例句", d: "R" },
    { t: "用单词造句、做对话练习", d: "K" }
  ]},
  { q: "别人给你指路时，你希望？", opts: [
    { t: "画一张地图给我", d: "V" },
    { t: "口头告诉我怎么走", d: "A" },
    { t: "写一段文字说明", d: "R" },
    { t: "带我走一遍", d: "K" }
  ]},
  { q: "你更喜欢哪种课堂形式？", opts: [
    { t: "有大量图片、视频、图表的课", d: "V" },
    { t: "老师讲解生动、有互动的课", d: "A" },
    { t: "有详细讲义和板书的课", d: "R" },
    { t: "有实验、案例分析、动手环节的课", d: "K" }
  ]},
  { q: "当你遇到难题卡住时，你会？", opts: [
    { t: "画图分析、列图表", d: "V" },
    { t: "找人讨论、讲出来就通了", d: "A" },
    { t: "查资料、看例题解法", d: "R" },
    { t: "动手尝试不同解法", d: "K" }
  ]},
  { q: "看电影/剧之后，你记得最清楚的是？", opts: [
    { t: "画面、场景、服装", d: "V" },
    { t: "台词、背景音乐", d: "A" },
    { t: "剧情逻辑、台词文字", d: "R" },
    { t: "动作场面、情绪感受", d: "K" }
  ]},
  { q: "你规划一天的学习任务时，习惯用？", opts: [
    { t: "时间轴、流程图、可视化表格", d: "V" },
    { t: "口头说一遍或录音提醒", d: "A" },
    { t: "写待办清单、打勾", d: "R" },
    { t: "直接做、想到什么做什么", d: "K" }
  ]},
  { q: "学一首新歌，你通常怎么学会？", opts: [
    { t: "看歌词MV", d: "V" },
    { t: "反复听原唱", d: "A" },
    { t: "看歌词跟着唱", d: "R" },
    { t: "跟着节奏哼、边唱边动", d: "K" }
  ]},
  { q: "你觉得下面哪种学习环境效率最高？", opts: [
    { t: "有好看的文具、整洁的桌面", d: "V" },
    { t: "有背景音或白噪音", d: "A" },
    { t: "有书本和纸笔", d: "R" },
    { t: "可以走动、换姿势", d: "K" }
  ]},
  { q: "别人跟你解释一件事，你更容易理解当TA？", opts: [
    { t: "画个图给你看", d: "V" },
    { t: "用语言详细描述", d: "A" },
    { t: "写下来给你看", d: "R" },
    { t: "做个示范给你看", d: "K" }
  ]},
  { q: "你玩手机/电脑时，最常做的是？", opts: [
    { t: "看图片、刷视频、看图表", d: "V" },
    { t: "听播客、听音乐、语音聊天", d: "A" },
    { t: "看文章、读小说、写东西", d: "R" },
    { t: "玩游戏、操作类应用", d: "K" }
  ]},
  { q: "你认为自己最擅长的学习方式是？", opts: [
    { t: "观察和模仿", d: "V" },
    { t: "倾听和交流", d: "A" },
    { t: "阅读和写作", d: "R" },
    { t: "实践和体验", d: "K" }
  ]},
  { q: "如果只能选一种备考资料，你选？", opts: [
    { t: "图文并茂的讲义", d: "V" },
    { t: "老师讲课的录音", d: "A" },
    { t: "详细的文字笔记", d: "R" },
    { t: "历年真题和练习题", d: "K" }
  ]}
];

// ============ 4种学习风格的报告内容 ============
const reports = {
  V: {
    icon: "👁️", name: "视觉型学习者", label: "Visual · 用眼睛学习",
    brief: "你通过图像、图表、颜色和空间布局来吸收信息效果最好。你擅长看思维导图、PPT和视频，对视觉细节敏感。",
    full: `<h3>🧠 你的学习画像</h3><p>你是典型的<strong>视觉型学习者</strong>，占人群约30%。你的大脑对图像、颜色、空间关系的处理效率远高于文字和声音。你看一眼思维导图就能记住大概框架，看视频比听讲座吸收快得多。</p>
<h3>✅ 你的学习优势</h3><p>• 空间想象力强，擅长几何、地理、设计类科目<br>• 观察力敏锐，能注意到别人忽略的细节<br>• 用思维导图整理知识效率极高<br>• 看一遍就能记住大致结构</p>
<h3>⚠️ 你的学习短板</h3><p>• 纯文字的长篇大论容易走神<br>• 只听老师讲不看板书时吸收差<br>• 容易被画面分散注意力<br>• 口头指令听完就忘</p>
<h3>🎯 提分策略</h3><p>1. <strong>笔记用思维导图</strong>：每章知识画成思维导图，用不同颜色分类，复习时只看图<br>2. <strong>善用视频资源</strong>：B站、中国大学MOOC找对应课程视频，比纯看书效率高2-3倍<br>3. <strong>彩色标注法</strong>：用4种颜色笔标注：定义(蓝)、重点(红)、例子(绿)、疑问(黄)<br>4. <strong>画出来</strong>：遇到抽象概念，尝试画成图或流程图，立刻就懂了<br>5. <strong>错题本用图表</strong>：把错题按题型和知识点做成表格，一目了然</p>
<h3>📅 备考规划建议</h3><p>• 第一遍：看视频课+画思维导图建立框架<br>• 第二遍：对照思维导图看书，补充细节<br>• 第三遍：只看思维导图回忆，卡壳处再翻书<br>• 冲刺：看自己画的图和错题表</p>`
  },
  A: {
    icon: "👂", name: "听觉型学习者", label: "Auditory · 用耳朵学习",
    brief: "你通过听和说来学习效果最好。你擅长听课、讨论、听录音，对语言的节奏和语调敏感。",
    full: `<h3>🧠 你的学习画像</h3><p>你是<strong>听觉型学习者</strong>，占人群约25%。你通过听和说吸收信息的效率最高。课堂上认真听老师讲比课后看书管用，跟同学讨论一遍比自己闷头学记得牢。</p>
<h3>✅ 你的学习优势</h3><p>• 语言理解和表达能力强，擅长文科和语言类科目<br>• 课堂吸收率高，老师讲的重点能快速抓住<br>• 通过讨论能快速理清思路<br>• 记忆力对声音和语言更敏感</p>
<h3>⚠️ 你的学习短板</h3><p>• 纯看书容易犯困、走神<br>• 看不懂图表和流程图<br>• 安静的环境反而效率低<br>• 写长文时容易卡住</p>
<h3>🎯 提分策略</h3><p>1. <strong>录音回听法</strong>：把自己的朗读或讲课录音，走路、吃饭时反复听<br>2. <strong>费曼学习法</strong>：把知识点讲给别人听（或对着空气讲），讲不清楚就是没学会<br>3. <strong>小组讨论</strong>：找同学组学习小组，互相讲解和提问<br>4. <strong>口诀记忆法</strong>：把知识点编成口诀、顺口溜，用唱的方式记<br>5. <strong>听课法</strong>：上课认真听比课后自学效率高3倍，坐前排、跟老师眼神交流</p>
<h3>📅 备考规划建议</h3><p>• 第一遍：认真听课/听视频，做简单笔记<br>• 第二遍：把笔记内容大声朗读并录音<br>• 第三遍：反复听录音+跟同学讨论<br>• 冲刺：自己给自己讲解每个知识点</p>`
  },
  R: {
    icon: "📖", name: "读写型学习者", label: "Read/Write · 用文字学习",
    brief: "你通过阅读和写作来学习效果最好。你擅长看书、做笔记、写总结，对文字信息的处理能力强。",
    full: `<h3>🧠 你的学习画像</h3><p>你是<strong>读写型学习者</strong>，占人群约15%。你对文字信息的处理能力最强，通过阅读和写作来巩固知识。你喜欢详细的笔记、清单和文字说明，觉得"好记性不如烂笔头"。</p>
<h3>✅ 你的学习优势</h3><p>• 阅读理解能力强，擅长所有需要大量阅读的科目<br>• 笔记记得详细且有条理<br>• 擅长文字表达，写作和论述题得分高<br>• 自主学习能力强，能靠看书学会</p>
<h3>⚠️ 你的学习短板</h3><p>• 看视频和听课时容易走神<br>• 对图表和空间关系不敏感<br>• 动手操作类任务不擅长<br>• 学习方式单一，容易陷入"抄书"</p>
<h3>🎯 提分策略</h3><p>1. <strong>康奈尔笔记法</strong>：页面分三栏——左边关键词、右边笔记、底部总结<br>2. <strong>总结提炼法</strong>：每看完一节，用自己的话写3-5句总结<br>3. <strong>提纲式笔记</strong>：用层级标题和编号整理知识，形成文字框架<br>4. <strong>错题详写</strong>：错题本不仅写答案，还要写错因、正确思路、同类题解法<br>5. <strong>输出倒逼输入</strong>：写学习心得、写解题过程、写知识串联</p>
<h3>📅 备考规划建议</h3><p>• 第一遍：通读教材+做详细笔记<br>• 第二遍：整理笔记，提炼提纲和关键词<br>• 第三遍：只看提纲回忆，默写不出来的再回去看<br>• 冲刺：背自己的笔记和错题本</p>`
  },
  K: {
    icon: "✋", name: "动觉型学习者", label: "Kinesthetic · 用身体学习",
    brief: "你通过动手做、亲身实践来学习效果最好。你擅长实验、操作、案例分析，坐着不动看书效率低。",

// ============ 状态管理 ============
let currentQ = 0;
let scores = { V: 0, A: 0, R: 0, K: 0 };
let answers = [];

function startTest() {
  currentQ = 0;
  scores = { V: 0, A: 0, R: 0, K: 0 };
  answers = [];
  showPage('page-test');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('q-num').textContent = `第 ${currentQ + 1} / ${questions.length} 题`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('progress').style.width = ((currentQ) / questions.length * 100) + '%';
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt.t;
    btn.onclick = () => selectOption(opt.d, btn);
    optsDiv.appendChild(btn);
  });
}

function selectOption(dim, btn) {
  document.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  scores[dim]++;
  answers.push(dim);
  setTimeout(() => {
    currentQ++;
    if (currentQ < questions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }, 200);
}

function showResult() {
  document.getElementById('progress').style.width = '100%';
  // 找出最高分维度
  let maxDim = 'V', maxScore = 0;
  for (const d in scores) {
    if (scores[d] > maxScore) { maxScore = scores[d]; maxDim = d; }
  }
  const r = reports[maxDim];
  document.getElementById('r-icon').textContent = r.icon;
  document.getElementById('r-type').textContent = r.name;
  document.getElementById('r-label').textContent = r.label;
  document.getElementById('r-brief').textContent = r.brief;
  document.getElementById('full-report').innerHTML = r.full;
  document.getElementById('full-report-show').innerHTML = r.full;
  showPage('page-result');
  // 重置支付区状态
  document.getElementById('pay-section').classList.remove('hidden');
  document.getElementById('unlocked-section').classList.add('hidden');
}

// ============ 支付（虎皮椒对接） ============
// ===== 把下面的配置改成你自己的虎皮椒信息 =====
const PAY_CONFIG = {
  appid: 'YOUR_APPID',           // 虎皮椒后台获取
  appsecret: 'YOUR_APPSECRET',   // 虎皮椒后台获取
  notify_url: 'https://your-domain.com/notify',  // 支付回调地址（可选，纯前端可不用）
  price: 499  // 4.99元，单位：分
};

function pay() {
  showPage('page-loading');
  // 生成订单号
  const orderId = 'LS' + Date.now() + Math.floor(Math.random() * 1000);

  // 方式一：跳转虎皮椒收银台（最简单，推荐新手）
  const payUrl = 'https://api.xunhupay.com/payment/do.html';
  const params = new URLSearchParams({
    appid: PAY_CONFIG.appid,
    out_trade_no: orderId,
    total_fee: PAY_CONFIG.price.toString(),
    body: '学习风格测试完整报告',
    notify_url: PAY_CONFIG.notify_url,
    return_url: window.location.href + '?unlocked=1&order=' + orderId,
    type: 'WAP'  // H5支付
  });

  // 跳转到虎皮椒支付页
  window.location.href = payUrl + '?' + params.toString();
}

// 页面加载时检查是否支付成功返回
window.onload = function() {
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('unlocked') === '1') {
    // 支付成功返回，显示完整报告
    // 注意：生产环境应验证订单状态，这里简化处理
    setTimeout(() => {
      showResult();
      document.getElementById('pay-section').classList.add('hidden');
      document.getElementById('unlocked-section').classList.remove('hidden');
    }, 100);
  }
};

function shareResult() {
  const type = document.getElementById('r-type').textContent;
  const text = `我测出来是【${type}】，你也来测测你的学习风格吧！`;
  if (navigator.share) {
    navigator.share({ title: '学习风格测试', text: text, url: window.location.href });
  } else {
    // 复制链接
    const input = document.createElement('input');
    input.value = text + ' ' + window.location.href;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    alert('链接已复制，快去分享给同学吧！');
  }
}

function restart() {
  showPage('page-home');
}

function showPage(id) {
  ['page-home', 'page-test', 'page-result', 'page-loading'].forEach(p => {
    document.getElementById(p).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
  window.scrollTo(0, 0);
}
